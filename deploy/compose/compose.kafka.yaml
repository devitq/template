services:
  kafka:
    image: docker.io/confluentinc/cp-kafka:8.0.3
    env_file:
      - path: ./infrastructure/configs/kafka/.env.template
        required: true
      - path: ./infrastructure/configs/kafka/.env
        required: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/bin/kafka-topics --bootstrap-server 127.0.0.1:9093 --list",
        ]
      interval: 15s
      timeout: 10s
      start_period: 20s
      start_interval: 5s
      retries: 3
    networks:
      - default
    profiles:
      - kafka
    restart: unless-stopped
    shm_size: 4mb
    volumes:
      - type: volume
        source: kafka_data
        target: /var/lib/kafka/data

  kafka-init:
    image: docker.io/confluentinc/cp-kafka:8.0.3
    entrypoint:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka:9093 \
        --create \
        --if-not-exists \
        --topic $$KAFKA_TOPIC \
        --replication-factor 1 \
        --partitions 1
    depends_on:
      kafka:
        restart: false
        condition: service_healthy
        required: true
    env_file:
      - path: ./infrastructure/configs/kafka/.env.template
        required: true
      - path: ./infrastructure/configs/kafka/.env
        required: false
    networks:
      - default
    profiles:
      - kafka
    restart: no
    shm_size: 4mb

volumes:
  kafka_data:
