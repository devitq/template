global:
  scrape_interval: 5s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
  - job_name: valkey
    static_configs:
      - targets:
          - redis-exporter:9121
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888
  - job_name: vmagent
    static_configs:
      - targets:
          - localhost:8429
