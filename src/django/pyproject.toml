[project]
dependencies = [
 "celery>=5.5.0,<6.0.0",
 "colorlog>=6.9.0,<7.0.0",
 "django-cors-headers>=4.7.0,<5.0.0",
 "django-environ>=0.12.0,<1.0.0",
 "django-extensions>=4.1.0,<5.0.0",
 "django-guid>=3.5.1,<4.0.0",
 "django-health-check>=3.18.3,<4.0.0",
 "django-storages[s3]>=1.14,<2.0",
 "django-ninja>=1.3.0,<2.0.0",
 "django-prometheus>=2.4.1,<3.0.0",
 "django-redis>=6.0.0,<7.0.0",
 "django-silk[formatting]>=5.4.0,<6.0.0",
 "django-stubs-ext>=5.1.3,<6.0.0",
 "gunicorn>=23.0.0,<24.0.0",
 "httpx>=0.28.1,<0.29.0",
 "opentelemetry-api>=1.35.0",
 "opentelemetry-distro>=0.56b0",
 "opentelemetry-exporter-otlp>=1.35.0",
 "opentelemetry-exporter-zipkin-proto-http>=1.11.1",
 "opentelemetry-instrumentation-asyncio>=0.56b0",
 "opentelemetry-instrumentation-celery>=0.56b0",
 "opentelemetry-instrumentation-dbapi>=0.56b0",
 "opentelemetry-instrumentation-django>=0.56b0",
 "opentelemetry-instrumentation-httpx>=0.56b0",
 "opentelemetry-instrumentation-psycopg2>=0.56b0",
 "opentelemetry-instrumentation-requests>=0.56b0",
 "opentelemetry-instrumentation-sqlite3>=0.56b0",
 "opentelemetry-instrumentation-threading>=0.56b0",
 "opentelemetry-instrumentation-urllib>=0.56b0",
 "opentelemetry-instrumentation-urllib3>=0.56b0",
 "opentelemetry-instrumentation-wsgi>=0.56b0",
 "opentelemetry-sdk>=1.35.0",
 "orjson>=3.10.15,<4.0.0",
 "pillow>=11.1.0,<12.0.0",
 "psycopg2-binary>=2.9.10,<3.0.0",
 "pydantic>=2.10.5,<3.0.0",
 "pyjwt>=2.10.1,<3.0.0",
 "python-json-logger>=3.2.1,<4.0.0",
 "pytz>=2024.2,<2025.0",
 "redis>=6.2.0,<7.0.0",
 "uvicorn[standard]>=0.34.0,<1.0.0",
 "uvicorn-worker>=0.2.0,<1.0.0",
 "yandex-cloud-ml-sdk>=0.3.1,<0.4.0",
]
name = "template-backend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
version = "0.1.0"

[dependency-groups]
dev = [
 "coverage",
 "django-debug-toolbar>=5.2,<5.3",
 "django-stubs[compatible-mypy]",
 "mypy",
 "ruff",
]

[tool.ruff]
fix = true
preview = true
target-version = "py313"
line-length = 120
indent-width = 4
exclude = [
 "**/migrations/*.py",
 ".bzr",
 ".direnv",
 ".eggs",
 ".git",
 ".git-rewrite",
 ".hg",
 ".mypy_cache",
 ".nox",
 ".pants.d",
 ".pytype",
 ".ruff_cache",
 ".svn",
 ".tox",
 ".venv",
 "__pypackages__",
 "_build",
 "buck-out",
 "dist",
 "node_modules",
 "venv",
]

[tool.ruff.lint]
select = [
 "A", # flake8-builtins
 "B", # flake8-bugbear
 "C4", # flake8-comprehensions
 "C90", # maccabe
 "COM", # flake8-commas
 "D", # pydocstyle
 "DTZ", # flake8-datetimez
 "E", # pycodestyle
 "ERA", # flake8-eradicate
 "EXE", # flake8-executable
 "F", # pyflakes
 "FA", # flake8-future-annotations
 "FBT", # flake8-boolean-trap
 "FLY", # pyflint
 "FLY", # pyflint
 "FURB", # refurb
 "G", # flake8-logging-format
 "I", # isort
 "ICN", # flake8-import-conventions
 "ISC", # flake8-implicit-str-concat
 "LOG", # flake8-logging
 "N", # pep8-naming
 "PERF", # perflint
 "PIE", # flake8-pie
 "PL", # pylint
 "PT", # flake8-pytest-style
 "PTH", # flake8-use-pathlib
 "Q", # flake8-quotes
 "RET", # flake8-return
 "RSE", # flake8-raise
 "RUF", # ruff
 "S", # flake8-bandit
 "SIM", # flake8-simpify
 "SLF", # flake8-self
 "SLOT", # flake8-slots
 "T100", # flake8-debugger
 "TRY", # tryceratops
 "UP", # pyupgrade
 "W", # pycodestyle
 "YTT", # flake8-2020
]
ignore = [
 "PLR1702",
 "A005", # allow to shadow stdlib and builtin module names
 "COM812", # trailing comma, conflicts with `ruff format`
 # Different doc rules that we don't really care about:
 "D",
 "ISC001", # implicit string concat conflicts with `ruff format`
 "ISC003", # prefer explicit string concat over implicit concat
 "PLR09", # we have our own complexity rules
 "PLR2004", # do not report magic numbers
 "PLR6301", # do not require classmethod / staticmethod when self not used
 "TRY003", # long exception messages from `tryceratops`
 "N813",
 "S106",
 "ERA",
 "PT022",
 "RUF001",
 "RUF012",
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
strict = true
strict_bytes = true
local_partial_types = true
warn_unreachable = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
enable_error_code = [
 "truthy-bool",
 "truthy-iterable",
 "redundant-expr",
 "unused-awaitable",
 "ignore-without-code",
 "possibly-undefined",
 "redundant-self",
 "explicit-override",
 "mutable-override",
 "unimported-reveal",
 "deprecated",
]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings        = false

[tool.coverage.run]
omit = [
 "config/asgi.py",
 "config/errors.py",
 "config/handlers.py",
 "config/settings.py",
 "config/urls.py",
 "config/wsgi.py",
 "manage.py",
]

[tool.coverage.report]
skip_covered = true
