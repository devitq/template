[build]
args_bin = []
entrypoint = "./tmp/main"
cmd = "go build  -o ./tmp/main ./cmd"

root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
pre_cmd = []
cmd = "just build-service"
post_cmd = []
entrypoint = ["./tmp/main"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor"]
include_dir = []
include_file = []
exclude_file = []
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
ignore_dangerous_root_dir = false
follow_symlink = true
log = "air.log"
poll = false
poll_interval = 500 # 0.5s
delay = 2000 # 2s
stop_on_error = true
send_interrupt = true
kill_delay = 500 # 500ns
rerun = false
rerun_delay = 500

[log]
time = true
main_only = false
silent = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true

[proxy]
enabled = true
proxy_port = 8090
app_port = 8080
app_start_timeout = 20000 # 20s
